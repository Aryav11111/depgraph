# Local development stack. Host ports are overridable to avoid clashes with
# anything already running on your machine.
name: depgraph

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-depgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-depgraph}
      POSTGRES_DB: ${POSTGRES_DB:-depgraph}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot migration job. The API only starts once this exits 0 -- the same
  # shape as running migrations as a Cloud Run Job before a deploy.
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &app-env
      APP_ENV: local
      LOG_JSON: "true"  # containers always log like prod; .env only affects host runs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-depgraph}:${POSTGRES_PASSWORD:-depgraph}@postgres:5432/${POSTGRES_DB:-depgraph}
      REDIS_URL: redis://redis:6379/0
      # Off locally (the E2E suite uploads many lockfiles from one address);
      # production sets real limits. Tests cover the limiter directly.
      UPLOAD_LIMIT_PER_IP: ${UPLOAD_LIMIT_PER_IP:-0}
      UPLOAD_LIMIT_GLOBAL: ${UPLOAD_LIMIT_GLOBAL:-0}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment: *app-env
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/health/ready', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Advisory sync worker: full OSV load on first start (no cursor), then an
  # incremental sync every OSV_SYNC_INTERVAL_S. A Postgres advisory lock keeps
  # concurrent syncs out, so running more than one replica is safe.
  worker:
    build: .
    command: ["python", "-m", "depgraph.advisories.cli", "worker"]
    environment:
      <<: *app-env
      OSV_SYNC_INTERVAL_S: ${OSV_SYNC_INTERVAL_S:-3600}
      OSV_INCLUDE_MALICIOUS: ${OSV_INCLUDE_MALICIOUS:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Tooling container for `make test|lint|fmt|migrate`. Behind a profile so
  # `docker compose up` never starts it; `docker compose run dev ...` does.
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    volumes:
      - .:/app
    environment:
      APP_ENV: test
      LOG_JSON: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-depgraph}:${POSTGRES_PASSWORD:-depgraph}@postgres:5432/${POSTGRES_DB:-depgraph}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
