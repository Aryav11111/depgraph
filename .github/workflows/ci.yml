name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.20"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: OpenAPI schema committed for the web app is current
        run: uv run python scripts/export_openapi.py --check

  test:
    runs-on: ubuntu-24.04
    # Real Postgres and Redis, same major versions as docker-compose.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: depgraph
          POSTGRES_PASSWORD: depgraph
          POSTGRES_DB: depgraph
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U depgraph" --health-interval 2s
          --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://depgraph:depgraph@localhost:5432/depgraph
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.20"
          enable-cache: true
      - run: uv sync --frozen
      - name: Migrations apply cleanly
        run: uv run alembic upgrade head
      - run: uv run pytest

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated API types match the committed OpenAPI schema
        run: npm run gen:api && git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Bundled sample lockfiles match the backend fixtures
        run: npm run check:samples
      - run: npm run build

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Image builds
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
